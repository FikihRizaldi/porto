services:
  - type: web
    name: portopro-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: MASTER_RECOVERY_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://fikihporto.vercel.app,https://porto.vercel.app
    healthCheckPath: /api/portfolio
